name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - name: Verify static owned runner profiles
        run: bash scripts/check-owned-runner-profiles.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get (hermetic tip signal)
        run: flutter pub get
      - name: Analyze (residual informational)
        continue-on-error: true
        run: flutter analyze
      - name: Test (residual informational)
        continue-on-error: true
        run: flutter test
